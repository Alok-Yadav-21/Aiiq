version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: allq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: allq_user
      POSTGRES_PASSWORD: allq_pass
      POSTGRES_DB: allq_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U allq_user -d allq_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: allq_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ''
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
